name: Synthetic monitor

# Probes the critical journey (account operation history and its older page)
# and the high-value journey catalogue against live Horizon.
# See docs/OPERATIONAL_HEALTH.md (#269, #368, #410).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Critical journey (${{ matrix.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        network: [testnet, mainnet]
        include:
          - network: testnet
            horizon: https://horizon-testnet.stellar.org
          - network: mainnet
            horizon: https://horizon.stellar.org

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The probe itself imports no npm packages, but scripts/loader.mjs (which
      # resolves the `@/` alias) imports `typescript`, so dev dependencies are needed.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run synthetic monitor
        env:
          UTIX_USER_ROLE: service
          HORIZON_URL: ${{ matrix.horizon }}
        run: npm run synthetic:monitor -- --network ${{ matrix.network }}

      # Every high-value journey (#368) as one workflow (#410). Each run is
      # stateless here, so one unhealthy critical journey fails the step.
      - name: Run critical workflow monitor
        if: ${{ !cancelled() }}
        env:
          UTIX_USER_ROLE: service
          HORIZON_URL: ${{ matrix.horizon }}
        run: npm run synthetic:monitor -- --network ${{ matrix.network }} --journey all

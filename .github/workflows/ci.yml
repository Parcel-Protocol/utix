name: CI

on:
  pull_request:
  push:
    branches:
      - main

# One run per workflow + ref. A new commit on a PR joins the same group and
# cancels only that PR's superseded run. Pushes keep their own group and are
# never cancelled by a PR, so release validation on main stays intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate feature registry
        run: npm run registry

      - name: Assert generated registry has no uncommitted changes
        run: |
          if ! git diff --exit-code core/registry/; then
            echo "::error::Stale generated registry files detected in core/registry/. Run 'npm run registry' and commit the changes."
            exit 1
          fi

      - name: Verify the feature contract
        run: npm run verify:features

      - name: Enforce feature-slice import boundaries
        run: npm run verify:boundaries

      - name: Verify the independent issue backlog
        run: npm run verify:issues

      - name: Verify migration compatibility and rollback readiness
        run: |
          npm run verify:migration-readiness
          npm run test -- core/migration

      - name: Verify permission and hidden-record contracts
        run: npm run verify:contract

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: set -o pipefail; npm run test:coverage | tee coverage/coverage.txt

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('coverage/coverage.txt') != '' }}
        run: |
          {
            echo "## Unit test coverage"
            echo
            echo '```text'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Check bundle budgets
        run: node scripts/bundle-budget.mjs

      - name: Verify reproducible release manifest
        run: |
          npm run verify:release-artifact
          node scripts/release-artifact.mjs --output .release/manifest-a.json
          node scripts/release-artifact.mjs --output .release/manifest-b.json
          cmp .release/manifest-a.json .release/manifest-b.json
          node scripts/release-artifact.mjs --verify .release/manifest-a.json

      - name: Upload release verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: utix-release-manifest
          path: .release/manifest-a.json
          if-no-files-found: error

      - name: Validate disaster recovery
        run: npm run recovery:validate

      - name: Check operational health
        run: npm run health:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        run: npm run test:e2e

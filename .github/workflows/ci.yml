name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate feature registry
        run: npm run registry

      - name: Assert generated registry has no uncommitted changes
        run: |
          if ! git diff --exit-code core/registry/; then
            echo "::error::Stale generated registry files detected in core/registry/. Run 'npm run registry' and commit the changes."
            exit 1
          fi

      - name: Verify the feature contract
        run: npm run verify:features

      - name: Enforce feature-slice import boundaries
        run: npm run verify:boundaries

      - name: Verify the independent issue backlog
        run: npm run verify:issues

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: set -o pipefail; npm run test:coverage | tee coverage/coverage.txt

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('coverage/coverage.txt') != '' }}
        run: |
          {
            echo "## Unit test coverage"
            echo
            echo '```text'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Check bundle budgets
        run: node scripts/bundle-budget.mjs

      - name: Validate disaster recovery
        run: npm run recovery:validate

      - name: Check operational health
        run: npm run health:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        run: npm run test:e2e
